name: sweet_water_tankers
description: "A professional water delivery website for Sweet Water Tankers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_map: 8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/gallery/
    - assets/images/hero/
    - assets/images/services/
    - assets/images/about/
    - assets/images/how-it-works/
    - assets/images/fleet/
    - assets/images/social/
    - assets/images/